<!DOCTYPE html>
<html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f4f7fb;margin:0;color:#1c293b}.wrap{max-width:540px;margin:30px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 28px #20304014}h1{font-size:23px;line-height:1.45;margin:8px 0}p{line-height:1.65}.small{color:#526273;font-size:14px}.notice{background:#fff5e7;border-left:5px solid #e99b29;padding:15px;margin:20px 0;border-radius:8px}label{display:block;font-weight:bold;margin:22px 0 8px}input[type=text],input[type=file]{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{width:100%;background:#185abc;color:white;border:0;border-radius:10px;padding:16px;font-size:17px;font-weight:bold;margin-top:24px;cursor:pointer}button:disabled{background:#8fa4c2}#status{margin-top:16px;line-height:1.6;font-weight:bold}.ok{color:#147a43}.error{color:#bd3131}
</style></head><body><div class="wrap"><div class="small">글빛초등학교 특수학급</div><h1>2027학년도 특수교육지도사 배치 신청<br>장애인복지카드 사진 제출</h1><p>신청 서류 작성에 필요한 장애인복지카드 사진을 제출해 주시기 바랍니다.</p><div class="notice"><strong>반드시 카드 앞면과 뒷면 사진 총 2장을 첨부해 주세요.</strong><br>첫 번째 사진은 앞면, 두 번째 사진은 뒷면 순서로 선택해 주세요.</div><form id="form"><label for="student">학생 이름</label><input id="student" type="text" maxlength="30" placeholder="학생 이름 입력" required><label for="photos">복지카드 사진 2장 (한 번에 선택)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" multiple required><p class="small">이미지 파일 2장만 선택해 주세요. 사진 1장당 최대 7MB, 총 14MB 이하입니다.</p><button id="submit" type="submit">사진 2장 제출하기</button></form><div id="status" role="status" aria-live="polite"></div><p class="small">제출한 자료는 신청 업무에 사용됩니다. 개인정보 처리와 보관에 관한 사항은 학교 안내에 따라 주세요.</p></div><script>
const form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('submit');
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({mime:file.type,base64:String(r.result).split(',')[1]});r.onerror=()=>reject(new Error('사진을 읽지 못했습니다.'));r.readAsDataURL(file)})}
form.addEventListener('submit',async e=>{e.preventDefault();const files=[...document.getElementById('photos').files];if(files.length!==2){status.className='error';status.textContent='앞면과 뒷면 사진을 정확히 2장 선택해 주세요.';return}if(files.some(f=>f.size>7*1024*1024)||files.reduce((s,f)=>s+f.size,0)>14*1024*1024){status.className='error';status.textContent='사진 용량을 줄인 뒤 다시 제출해 주세요.';return}button.disabled=true;status.className='';status.textContent='사진을 전송 중입니다. 창을 닫지 마세요.';try{const data=await Promise.all(files.map(readFile));google.script.run.withSuccessHandler(msg=>{status.className='ok';status.textContent=msg;form.reset();button.disabled=false}).withFailureHandler(err=>{status.className='error';status.textContent='전송 실패: '+err.message;button.disabled=false}).submitCard({student:document.getElementById('student').value,files:data})}catch(err){status.className='error';status.textContent=err.message;button.disabled=false}});
</script></body></html>
